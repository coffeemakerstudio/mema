name: Build and publish Mema

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mema-go/go.mod

      - name: Import GPG Key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      # The imported secret key must match the fingerprint published in mema.gpg.

      - name: Build Packages
        run: |
          ./build-repo.sh
          MEMA_ARCH=riscv64 DIST_DIR=dist-riscv64 DEB_DIR=debs-riscv64 ./build-repo.sh
          cp dist-riscv64/mema_*_riscv64.deb dist/
          (
            cd dist
            apt-ftparchive packages . > Packages
            gzip -kf Packages
            apt-ftparchive release . > Release
          )
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            gpg --batch --yes --dearmor -o dist/mema-keyring.gpg mema.gpg
            gpg --batch --yes --local-user "${MEMA_SIGNING_KEY:-66315E3863522B0C320065281C7625C7FCF952B2}" --clearsign --digest-algo SHA256 -o dist/InRelease dist/Release
            gpg --batch --yes --local-user "${MEMA_SIGNING_KEY:-66315E3863522B0C320065281C7625C7FCF952B2}" --armor --detach-sign --digest-algo SHA256 -o dist/Release.gpg dist/Release
          fi

      - name: Run helper tests
        run: ./tests/test_helpers.sh

      - name: Test core package architecture metadata
        run: ./tests/test_package_architecture.sh

      - name: Test recipe dependency packages
        run: ./tests/test_recipe_dependencies.sh

      - name: Run Go tests and vet
        run: |
          cd mema-go
          go test ./...
          go vet ./...

      - name: Run Docker Integration Test
        run: |
          chmod +x ./tests/test.sh
          ./tests/test.sh

      - name: Run Debian outside test
        run: ./tests/test_outside.sh

      - name: Run Wayland POC test
        run: ./tests/test_wayland_poc.sh

      - name: Run Sway POC test
        run: ./tests/test_sway_poc.sh

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist     
          branch: gh-pages 
          clean: true
