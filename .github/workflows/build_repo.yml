name: Build and publish Mema

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Recipes Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mema-go/go.mod

      - name: Install Template Package Assembler
        run: |
          go install github.com/eugen252009/tpa@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Import GPG Key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build Packages
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            MEMA_SIGN=1 ./build-repo.sh
          else
            ./build-repo.sh
          fi

      - name: Run Docker Integration Test
        run: |
          chmod +x ./tests/test.sh
          ./tests/test.sh

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist     
          branch: gh-pages 
          clean: true
