	<script>
		function createNewCard({title,imglink,cardLink, linkalt}){
			const card = document.createElement("li");
			card.classList.add("card");

			const titlespan = document.createElement("span");
			const titleSpanClassList=[
				"font-semibold",
				"text-2xl",
				"pb-4"
			];

			titleSpanClassList.forEach(x=>titlespan.classList.add(x))
			titlespan.textContent=title;

			const img =document.createElement("img");
			const imgClassList=[
			"object-cover",
			"w-full",
			"object-top",
			"h-96",
			];
			imgClassList.forEach(x=>img.classList.add(x))
			img.src=imglink??"";
		
			const a = document.createElement("a");
			a.classList.add("grid");
			a.href=cardLink??"";
			

			a.appendChild(titlespan);
			a.appendChild(img);

			card.appendChild(a);

			document.querySelector(".project_cards").appendChild(card);
		}
		// createNewCard({title:"Vulpes DAO",imglink:"/static/VulpesDao.png",cardLink:"/docs/api/"});
